<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel: CAGED guide</title>
<style>
  /* Carousel (4:5, 1080×1350): a guide to the CAGED system.
     Same look as pentatonic.html.
     Open `caged.html` to review (slides at 30 %), `?full` shows them at full size, `node export.mjs caged` writes the PNGs. */
  :root { --page: #0d0e17; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: #e9e9ed; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  .head { padding: 24px 32px 4px; }
  .head h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .head p { margin: 0; color: rgba(233,233,237,.62); font-size: 13px; max-width: 760px; line-height: 1.5; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; padding: 18px 32px 32px; }
  .frame { flex: none; width: 324px; height: 405px; position: relative; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .slide { position: absolute; left: 0; top: 0; width: 1080px; height: 1350px; transform: scale(.3); transform-origin: 0 0;
    display: flex; flex-direction: column; padding: 100px 80px 0;
    --bg: #f3f5fe; --text: #161826; --muted: rgba(22,24,38,.62); --accent: #5d5294; --bright: #796cbf; --warm: #c0603c; --home: #d9a521; --line: rgba(22,24,38,.14); --surface: #e4e7f5;
    background: var(--bg); color: var(--text); }
  body.full .frame { width: 1080px; height: 1350px; border-radius: 0; box-shadow: none; }
  body.full .slide { transform: none; }
  body.full .row { gap: 0; padding: 0; display: block; }
  body.full .head { display: none; }
  .kicker { font-size: 32px; letter-spacing: .18em; font-weight: 600; color: var(--bright); text-transform: uppercase; }
  .h { margin: 24px 0 0; font-size: 92px; line-height: 1.04; font-weight: 600; letter-spacing: -.02em; }
  .h.s { font-size: 80px; }
  .h.xs { font-size: 72px; }
  .h em { font-style: normal; color: var(--bright); }
  .sub { margin: 28px 0 0; font-size: 40px; line-height: 1.32; color: var(--muted); max-width: 920px; }
  .sub b { color: var(--text); font-weight: 600; }
  .vis { margin-top: auto; margin-bottom: 170px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 64px; display: flex; justify-content: space-between; align-items: center;
    font-size: 30px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .foot b { color: var(--text); font-weight: 600; }
  svg { display: block; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { min-width: 96px; height: 120px; border-radius: 24px; background: var(--surface); display: grid; place-items: center; font-size: 60px; font-weight: 600; padding: 0 22px; }
  .chip.on { background: var(--accent); color: #fff; }
  .chip.sm { min-width: 0; height: 76px; font-size: 34px; border-radius: 18px; padding: 0 20px; display: flex; align-items: center; white-space: nowrap; }
  .list { display: grid; gap: 26px; }
  .li { display: flex; align-items: center; gap: 30px; font-size: 50px; font-weight: 600; line-height: 1.15; }
  .li small { font-size: 34px; font-weight: 500; color: var(--muted); display: block; margin-top: 4px; }
  .num { width: 96px; height: 96px; flex: none; border-radius: 48px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 50px; }
  .num.ok { background: var(--bright); }
  .card { background: var(--surface); border-radius: 30px; padding: 36px 44px; font-size: 36px; line-height: 1.38; }
  .card b { color: var(--bright); font-weight: 600; }
  .lbl { font-size: 30px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px 4px; font-weight: 600; }
  .lbl b { color: var(--text); text-transform: none; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: end; }
  .legend { display: flex; gap: 34px; font-size: 32px; color: var(--muted); margin-top: 22px; align-items: center; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 34px; height: 34px; border-radius: 50%; vertical-align: -6px; margin-right: 12px; }
  .imap { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 28px; }
  .imap .card { display: flex; align-items: center; font-size: 32px; }
  .irow { display: grid; grid-template-columns: 110px 460px 1fr; align-items: center; gap: 26px; }
  .irow .chip { height: 104px; min-width: 104px; font-size: 54px; }
  .formula { font-size: 36px; font-weight: 600; letter-spacing: .06em; font-variant-numeric: tabular-nums; white-space: pre; }
  .formula small { display: block; font-size: 26px; font-weight: 500; color: var(--muted); letter-spacing: .04em; margin-top: 6px; white-space: normal; }
  .tbl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 26px; }
  .tbl div { background: var(--surface); border-radius: 22px; padding: 20px 24px; font-size: 40px; font-weight: 600; }
  .tbl small { display: block; font-size: 28px; font-weight: 500; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="head">
  <h1>Carousel: CAGED guide</h1>
  <p>1080×1350 (4:5), shown at 30 %. Add <code>?full</code> to the URL for full size.</p>
</div>
<div class="row" id="root"></div>

<script>
// ---------- fretboard (string 0 = high e … 5 = low E, as in pentatonic.html) ----------
const KIND = { R: 'home', 3: 'on', b3: 'on', 5: 'five', '#5': 'five', b7: 'on' };

/** Chord from low-E → high-e fret list and tone list, e.g. ch('x 3 2 0 1 0', 'x R 3 5 R 3'). changed: tones drawn as altered notes. */
function ch(frets, tones, { names, changed = [] } = {}) {
  const F = frets.split(' '), T = tones.split(' '), N = names ? names.split(' ') : null, dots = [], mute = [];
  F.forEach((f, i) => {
    const s = 5 - i;
    if (f === 'x') { mute.push(s); return; }
    const t = T[i];
    dots.push({ s, f: +f, label: N ? N[i] : t, kind: changed.includes(t) ? 'chg' : KIND[t] });
  });
  return { dots, mute };
}

/** dots: [{s, f, label?, kind: home|on|five|chg|ghost|dim|was}], bands: [{a, b, label, row}] brackets above the neck */
function board({ nFrets, from = 1, dots = [], mute = [], bands = [], nums = true, h = 300, w = 920, pad = 30, allNums = null }) {
  const X0 = 60, cell = (w - X0 - 8) / nFrets, top = pad + (bands.length ? 120 : 0), gap = (h - top - (nums ? 66 : pad)) / 5;
  const fx = (f) => (f === 0 ? X0 - 30 : X0 + (f - from + 0.5) * cell), sy = (i) => top + i * gap, R = Math.min(30, cell * 0.42, gap * 0.47);
  let g = '';
  for (const b of bands) {   // shape brackets above the strings
    const x1 = b.a === 0 ? X0 - 52 : X0 + (b.a - from) * cell + 6, x2 = X0 + (b.b - from + 1) * cell - 6, y = pad + 22 + b.row * 56;
    g += `<path d="M${x1} ${y + 22} V${y} H${x2} V${y + 22}" fill="none" stroke="var(--bright)" stroke-width="4" stroke-linecap="round"/>`;
    g += `<rect x="${(x1 + x2) / 2 - 26}" y="${y - 24}" width="52" height="48" rx="12" fill="var(--accent)"/>`;
    g += `<text x="${(x1 + x2) / 2}" y="${y + 12}" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">${b.label}</text>`;
  }
  for (const m of [3, 5, 7, 9, 15, 17]) if (m >= from && m < from + nFrets) g += `<circle cx="${fx(m)}" cy="${(sy(2) + sy(3)) / 2}" r="9" fill="var(--text)" opacity=".1"/>`;
  if (12 >= from && 12 < from + nFrets) for (const yy of [(sy(1) + sy(2)) / 2, (sy(3) + sy(4)) / 2]) g += `<circle cx="${fx(12)}" cy="${yy}" r="9" fill="var(--text)" opacity=".1"/>`;
  for (let f = 0; f <= nFrets; f++) g += `<line x1="${X0 + f * cell}" y1="${sy(0) - 12}" x2="${X0 + f * cell}" y2="${sy(5) + 12}" stroke="var(--text)" stroke-opacity="${f === 0 && from === 1 ? .75 : .2}" stroke-width="${f === 0 && from === 1 ? 8 : 3}"/>`;
  for (let i = 0; i < 6; i++) g += `<line x1="${X0}" y1="${sy(i)}" x2="${X0 + nFrets * cell}" y2="${sy(i)}" stroke="var(--text)" stroke-opacity=".28" stroke-width="3"/>`;
  if (nums) for (let f = from; f < from + nFrets; f++) if ((allNums ?? nFrets <= 7) || [3, 5, 7, 9, 12, 15].includes(f)) g += `<text x="${fx(f)}" y="${sy(5) + 50}" text-anchor="middle" font-size="26" fill="var(--text)" fill-opacity=".45">${f}</text>`;
  for (const s of mute) g += `<text x="${X0 - 30}" y="${sy(s) + 11}" text-anchor="middle" font-size="32" font-weight="600" fill="var(--text)" fill-opacity=".4">×</text>`;
  for (const d of dots) {
    const x = fx(d.f), y = sy(d.s), k = d.kind || 'on';
    const r = { dim: R * 0.62, was: R }[k] ?? R;
    if (k === 'was') { g += `<circle cx="${x}" cy="${y}" r="${r - 2}" fill="none" stroke="var(--warm)" stroke-width="4" stroke-dasharray="8 7"/>`; continue; }
    if (k === 'dim') { g += `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--accent)" opacity=".28"/>`; continue; }
    if (k === 'extra') { g += `<circle cx="${x}" cy="${y}" r="${R * 0.62}" fill="none" stroke="var(--text)" stroke-opacity=".45" stroke-width="3" stroke-dasharray="6 6"/>`; continue; }
    const fill = { home: 'var(--home)', on: 'var(--accent)', five: 'var(--bg)', chg: 'var(--warm)', pass: 'var(--surface)' }[k];
    if (k === 'chg') g += `<circle cx="${x}" cy="${y}" r="${r * 1.45}" fill="var(--warm)" opacity=".22"/>`;
    g += `<circle cx="${x}" cy="${y}" r="${k === 'five' || k === 'pass' ? r - 2.5 : r}" fill="${fill}" ${k === 'five' ? 'stroke="var(--accent)" stroke-width="5"' : k === 'pass' ? 'stroke="var(--text)" stroke-opacity=".35" stroke-width="4"' : ''}/>`;
    if (d.label) {
      const L = d.label.replace('b', '♭').replace('#', '♯');
      const fs = L.length > 2 ? R * 0.66 : L.length > 1 ? R * 0.8 : R * 1.0;
      g += `<text x="${x}" y="${y + fs * 0.35}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${k === 'home' || k === 'pass' ? '#161826' : k === 'five' ? 'var(--accent)' : '#fff'}">${L}</text>`;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}">${g}</svg>`;
}
const B = (c, o) => board({ ...o, dots: [...(o.dots || []), ...c.dots], mute: c.mute });

// ---------- chord data (all checked note by note) ----------
const C_SHAPES = [   // C major in every shape, up the neck
  ch('x 3 2 0 1 0', 'x R 3 5 R 3'),        // C shape, open
  ch('x 3 5 5 5 3', 'x R 5 R 3 5'),        // A shape, fret 3
  ch('8 7 5 5 5 8', 'R 3 5 R 3 R'),        // G shape, frets 5–8
  ch('8 10 10 9 8 8', 'R 5 R 3 5 R'),      // E shape, fret 8
  ch('x x 10 12 13 12', 'x x R 5 R 3'),    // D shape, frets 10–13
  ch('x 15 14 12 13 12', 'x R 3 5 R 3'),   // C shape again, frets 12–15
];
const uniq = (ds) => [...new Map(ds.map((d) => [`${d.s},${d.f}`, d])).values()];
const C_NECK = uniq(C_SHAPES.flatMap((c) => c.dots));
const C_BANDS = [{ a: 0, b: 3, label: 'C', row: 0 }, { a: 3, b: 5, label: 'A', row: 1 }, { a: 5, b: 8, label: 'G', row: 0 }, { a: 8, b: 10, label: 'E', row: 1 }, { a: 10, b: 13, label: 'D', row: 0 }, { a: 12, b: 15, label: 'C', row: 1 }];

const OPEN = {
  C: [ch('x 3 2 0 1 0', 'x R 3 5 R 3'), '×  R  3  5  R  3', 'D + e strings'],
  A: [ch('x 0 2 2 2 0', 'x R 5 R 3 5'), '×  R  5  R  3  5', 'B string'],
  G: [ch('3 2 0 0 0 3', 'R 3 5 R 3 R'), 'R  3  5  R  3  R', 'A + B strings'],
  E: [ch('0 2 2 1 0 0', 'R 5 R 3 5 R'), 'R  5  R  3  5  R', 'G string'],
  D: [ch('x x 0 2 3 2', 'x x R 5 R 3'), '×  ×  R  5  R  3', 'high e string'],
};

const LEGEND = `<div class="legend"><span><i style="background:var(--home)"></i>Root</span><span><i style="background:var(--accent)"></i>3rd</span><span><i style="background:var(--bg);box-shadow:inset 0 0 0 5px var(--accent)"></i>5th</span></div>`;

// ---------- slides ----------
const BRAND = 'Ear Warrior';
const slide = (n, total, inner) => `<div class="frame"><div class="slide">${inner}<div class="foot"><b>${BRAND}</b><span>${n} / ${total}${n < total ? ' &nbsp;→' : ''}</span></div></div></div>`;
const kick = (t) => `<div class="kicker">${t}</div>`;
const H = (t, c = '') => `<h1 class="h ${c}" style="margin-block-end:0">${t}</h1>`;
const SUB = (t) => `<p class="sub">${t}</p>`;
const VIS = (t, mb) => `<div class="vis"${mb != null ? ` style="margin-bottom:${mb}px"` : ''}>${t}</div>`;

// Box 1 of C major pentatonic (C D E G A), frets 5–8, plus the 4th (F) and 7th (B) nearby
const BOX1 = [[5, 5], [5, 8], [4, 5], [4, 7], [3, 5], [3, 7], [2, 5], [2, 7], [1, 5], [1, 8], [0, 5], [0, 8]];
const FB = [[4, 8], [1, 6], [5, 7], [2, 4], [0, 7]];   // F on A8, B6 · B on E7, G4, e7
const C_G = ch('8 7 5 5 5 8', 'R 3 5 R 3 R');           // C major, G shape
const onC = (s, f) => C_G.dots.some((d) => d.s === s && d.f === f);
// Ode to Joy (Beethoven, public domain), first phrase in C: E E F G | G F E D | C C D E | E D D — all on the G and B strings, frets 5–8
const ODE = [{ s: 1, f: 5, label: 'E', kind: 'on' }, { s: 1, f: 6, label: 'F', kind: 'pass' }, { s: 1, f: 8, label: 'G', kind: 'five' }, { s: 2, f: 5, label: 'C', kind: 'home' }, { s: 2, f: 7, label: 'D', kind: 'pass' }];
const BARS = [['C', '<b>E E</b> F <b>G</b>'], ['G', '<b>G</b> F E <b>D</b>'], ['C', '<b>C C</b> D <b>E</b>'], ['G', 'E <b>D D</b>']];

const S = [
  // 1 — cover
  (n, t) => slide(n, t, kick('Play by ear · save this') + H('CAGED: find any melody <em>on the neck</em>') +
    SUB('Five chord shapes show you the notes a tune is most likely to use, wherever your hand is.') +
    VIS(`<div class="chips" style="gap:22px">${'CAGED'.split('').map((x) => `<div class="chip on" style="width:164px;height:200px;font-size:110px;border-radius:36px">${x}</div>`).join('')}</div>`)),

  // 2 — the idea
  (n, t) => slide(n, t, kick('The idea') + H('Open chords are <em>movable shapes</em>', 's') +
    SUB('C, A, G, E and D each hide a barre behind the nut. Put your index finger (or a capo) there and slide the shape up the neck.') +
    VIS(`<div class="two">
      <div><div class="lbl"><b>C</b> · open</div>${B(ch('x 3 2 0 1 0', 'x R 3 5 R 3'), { nFrets: 5, h: 330, w: 446, allNums: true })}</div>
      <div><div class="lbl"><b>D</b> · same shape, +2 frets</div>${B(ch('x 5 4 2 3 2', 'x R 3 5 R 3'), { nFrets: 5, from: 2, h: 330, w: 446, allNums: true })}</div>
    </div>` + LEGEND)),

  // 3 — root strings
  (n, t) => slide(n, t, kick('Rule 1 · the root') + H('Each shape has its <em>root string</em>', 's') +
    SUB('Find the root, drop the shape. B on the low E, fret 7 → <b>B major in the E or G shape</b>, right there.') +
    VIS(`<div class="list">
      <div class="li"><span class="num">6</span><div>Low E string<small>root of the E and G shapes</small></div><div class="chips" style="margin-left:auto"><div class="chip on">E</div><div class="chip on">G</div></div></div>
      <div class="li"><span class="num">5</span><div>A string<small>root of the C and A shapes</small></div><div class="chips" style="margin-left:auto"><div class="chip on">C</div><div class="chip on">A</div></div></div>
      <div class="li"><span class="num">4</span><div>D string<small>root of the D shape</small></div><div class="chips" style="margin-left:auto"><div class="chip on">D</div></div></div>
    </div>`)),

  // 4 — order
  (n, t) => slide(n, t, kick('Rule 2 · the order') + H('C → A → G → E → D, <em>then again</em>', 'xs') +
    SUB('Shapes of one chord line up in this order up the neck, so the chord is always within reach of your hand.') +
    VIS(board({ nFrets: 15, dots: C_NECK, bands: C_BANDS, mute: [5], h: 470 }) + `<div class="sub" style="font-size:34px;margin-top:18px">C major from the open position to fret 15.</div>`)),

  // 5 — interval map
  (n, t) => slide(n, t, kick('The interval map') + H('Where root, 3rd and 5th <em>live</em>', 'xs') +
    VIS(`<div class="imap">${Object.entries(OPEN).map(([k, [c, f, note]]) => `<div><div class="lbl" style="text-transform:none;letter-spacing:.02em"><b>${k} shape</b> · 3rd on ${note}</div>${B(c, { nFrets: 4, h: 250, w: 446, pad: 18, nums: false })}</div>`).join('')}
      <div class="card">Each shape is just 3 notes: root (gold), 3rd (purple), 5th (outlined). Move every purple dot down one fret → minor.</div></div>`, 120)),

  // 6 — by ear 1: chord tones first
  (n, t) => slide(n, t, kick('By ear · step 1') + H('Melodies lean on <em>chord tones</em>', 's') +
    SUB('Find home by ear: the note the tune ends on. Drop the nearest shape on it. Its root, 3rd and 5th are your <b>first guesses</b> for long notes and downbeats.') +
    VIS(B(C_G, { nFrets: 6, from: 4, h: 380, allNums: true }) + LEGEND + `<div class="sub" style="font-size:32px;margin-top:14px">Home = C → C major, G shape, frets 5–8.</div>`, 140)),

  // 7 — by ear 2: the box fills the gaps
  (n, t) => slide(n, t, kick('By ear · step 2') + H('The box <em>fills the gaps</em>', 's') +
    SUB('Missed? The next guess is 1–2 frets away. The pentatonic box around the shape holds most in-between notes.') +
    VIS(board({ nFrets: 6, from: 4, h: 380, allNums: true, dots: [
      ...BOX1.filter(([s, f]) => !onC(s, f)).map(([s, f]) => ({ s, f, kind: 'dim' })),
      ...FB.map(([s, f]) => ({ s, f, kind: 'extra' })), ...C_G.dots] }) +
    `<div class="legend"><span><i style="background:var(--home)"></i><i style="background:var(--accent);margin-left:-6px"></i>Chord tones</span><span><i style="background:var(--accent);opacity:.28"></i>Box note</span><span><i style="box-shadow:inset 0 0 0 3px rgba(22,24,38,.45)"></i>4th / 7th, when the ear asks</span></div>
    <div class="lbl" style="margin-top:26px;text-transform:none;letter-spacing:.02em">Each pentatonic box wraps one shape:</div><div class="chips">${[['Box 1', 'G'], ['Box 2', 'E'], ['Box 3', 'D'], ['Box 4', 'C'], ['Box 5', 'A']].map(([b, s]) => `<div class="chip sm">${b} <span style="color:var(--bright);margin-left:12px">${s}</span></div>`).join('')}</div>`, 130)),

  // 8 — worked example
  (n, t) => slide(n, t, kick('Try it · Ode to Joy') + H('The whole phrase in <em>one spot</em>', 's') +
    SUB('Home is C. Five notes on two strings, frets 5–8. Bold notes are tones of the chord underneath.') +
    VIS(board({ nFrets: 5, from: 4, h: 360, allNums: true, dots: ODE }) +
    `<div class="tbl" style="grid-template-columns:repeat(4,1fr)">${BARS.map(([c, x]) => `<div style="font-weight:500;color:var(--muted)"><span style="color:var(--bright);font-weight:700">${c}</span><br><span style="font-size:36px;letter-spacing:.04em;color:rgba(22,24,38,.38)">${x.replace(/<b>/g, '<b style="color:var(--text)">')}</span></div>`).join('')}</div>`, 130)),

  // 9 — chord changes
  (n, t) => slide(n, t, kick('By ear · step 3') + H('Chord changed? <em>Its shape is right here</em>', 'xs') +
    SUB('In bar 2 the chord turns to G and the tune leans on G and D. All six chords of C major sit in frets 5–9:') +
    VIS(board({ nFrets: 6, from: 4, h: 380, allNums: true, dots: [
      { s: 5, f: 8, label: 'C', kind: 'home' }, { s: 4, f: 5, label: 'Dm', kind: 'home' }, { s: 4, f: 7, label: 'Em', kind: 'home' },
      { s: 4, f: 8, label: 'F', kind: 'home' }, { s: 3, f: 5, label: 'G', kind: 'home' }, { s: 5, f: 5, label: 'Am', kind: 'home' }] }) +
    `<div class="tbl">
      <div>C<small>G shape</small></div><div>Dm<small>A shape, minor</small></div><div>Em<small>A shape, minor</small></div>
      <div>F<small>C shape</small></div><div>G<small>D shape</small></div><div>Am<small>E shape, minor</small></div>
    </div>`, 130)),

  // 10 — recap
  (n, t) => slide(n, t, kick('Recap · your next song') + H('Pick it out by ear in <em>5 moves</em>', 'xs') +
    VIS(`<div class="list" style="gap:20px">
      <div class="li" style="font-size:40px"><span class="num ok">1</span>Hear home: the note the tune ends on</div>
      <div class="li" style="font-size:40px"><span class="num ok">2</span>Drop the nearest CAGED shape on it</div>
      <div class="li" style="font-size:40px"><span class="num ok">3</span>Try root, 3rd, 5th first</div>
      <div class="li" style="font-size:40px"><span class="num ok">4</span>Missed? Look 1–2 frets away</div>
      <div class="li" style="font-size:40px"><span class="num ok">5</span>Chord changed? Jump to its shape</div>
    </div>
    <div class="card" style="margin-top:34px;font-size:32px">Save this and try it on your next song. Send it to a friend who still plays from tabs.</div>`, 130)),
];

if (location.search.includes('full')) document.body.classList.add('full');
