<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ear Warrior challenge</title>
<!--
  One 15 s challenge video (1080x1920, 30 fps). render.mjs injects window.CHALLENGE = { ...challenge, timeline }
  before this page loads; every element is a pure function of time via window.renderAt(t), same as the promo.
  Timing comes from timeline.mjs — never hard-code a second here.

    hook + LISTEN  melody plays once; nothing on screen reveals a pitch (that would be a hint)
    TURN           countdown while the viewer plays it back
    REVEAL         the melody again, notes light up on a keyboard
    OUTRO          "how many notes did you get?"

  Two layouts. Default: logo + rings while listening, keyboard only at the answer. layout "keyboard" (with
  coldOpen in timeline.mjs): the keyboard is on screen from frame 0, the headline is large, and every note
  just pulses the keyboard's frame — still no hint about which key.

  Series videos (classics.mjs, kind "quiz") reuse the keyboard layout with their own timeline (timeline.mjs,
  seriesTimeline) and `body.ser` rules: the hook headline + the melody from frame 0 → "write the notes in the
  comments" + the melody again → end card.

  Palette mirrors src/theme/nocturne.ts, landing/index.html and the promo.
-->
<style>
  :root {
    --bg: #161826;
    --surface: #232532;
    --text: #e9e9ed;
    --muted: rgba(233, 233, 237, 0.6);
    --accent: #9184d9;
    --bright: #b5abfc;
    --warm: #c2a190;
    --line: rgba(233, 233, 237, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  #glow {
    position: absolute; inset: 0;
    background: radial-gradient(820px 820px at 50% 60%, rgba(145, 132, 217, 0.24), transparent 70%);
  }
  /* A phase group; its opacity is driven by renderAt. Children fade up via [data-in]. */
  .grp { position: absolute; opacity: 0; }
  .full { inset: 0; }
  [data-in] { opacity: 0; }

  /* Keep clear of the Reels/Shorts/TikTok UI: ~220px top, ~330px bottom (content stays in y 220–1590). */
  #top { left: 96px; right: 96px; top: 244px; display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 650; letter-spacing: -0.02em; }
  .brand img { width: 60px; height: 60px; border-radius: 15px; display: block; }
  .tag {
    font-size: 28px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bright);
    border: 1.5px solid var(--line); border-radius: 999px; padding: 14px 28px;
  }

  .head { left: 96px; top: 380px; width: 888px; }
  h1 { font-size: 116px; line-height: 1.03; font-weight: 700; letter-spacing: -0.035em; }
  h1.tight { font-size: 100px; line-height: 1.06; }
  h1 em { font-style: normal; color: var(--bright); }
  .sub { font-size: 42px; line-height: 1.35; color: var(--muted); margin-top: 34px; max-width: 840px; }

  /* LISTEN */
  .ring { position: absolute; left: 420px; top: 1030px; width: 240px; height: 240px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
  #logo { position: absolute; left: 430px; top: 1040px; width: 220px; height: 220px; border-radius: 52px; box-shadow: 0 0 110px rgba(145, 132, 217, 0.45); }
  #dots { position: absolute; left: 0; right: 0; top: 1440px; display: flex; justify-content: center; gap: 28px; }
  .dot { width: 36px; height: 36px; border-radius: 50%; background: rgba(233, 233, 237, 0.14); }

  /* TURN */
  #count { position: absolute; left: 310px; top: 950px; width: 460px; height: 460px; }
  #num {
    position: absolute; left: 310px; top: 950px; width: 460px; height: 460px;
    display: grid; place-items: center; font-size: 230px; font-weight: 700; letter-spacing: -0.04em; color: var(--bright);
  }

  /* REVEAL */
  #chips { position: absolute; left: 96px; top: 860px; width: 888px; display: flex; justify-content: center; gap: 14px; }
  .nchip {
    flex: 1 1 0; max-width: 150px; height: 112px; border-radius: 30px; border: 1.5px solid var(--line);
    display: grid; place-items: center; font-size: 46px; font-weight: 650; letter-spacing: -0.02em; color: var(--muted);
  }
  #kbCard { inset: auto; left: 96px; top: 1030px; width: 888px; background: var(--surface); border: 1px solid var(--line); border-radius: 40px; padding: 28px; }
  #kb { position: relative; width: 832px; height: 360px; }
  .wk { position: absolute; top: 0; height: 360px; border-radius: 0 0 12px 12px; background: rgba(233, 233, 237, 0.16); }
  .bk { position: absolute; top: 0; height: 220px; border-radius: 0 0 10px 10px; background: #0f101b; border: 1px solid var(--line); border-top: none; }
  .wk .c { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 20px; color: var(--muted); }

  /* KEYBOARD LAYOUT: big headline, keyboard in frame the whole time (y 1060–1516), a mid zone for dots / countdown / chips. */
  body.keys .head { top: 320px; }
  body.keys .head h1 { font-size: 168px; line-height: 1; white-space: nowrap; }
  body.keys .head .sub { font-size: 50px; margin-top: 30px; }
  body.keys .ring, body.keys #logo { display: none; }
  body.keys #dots { top: 790px; gap: 30px; }
  body.keys .dot { width: 44px; height: 44px; }
  body.keys #count { left: 405px; top: 760px; width: 270px; height: 270px; }
  body.keys #num { left: 405px; top: 760px; width: 270px; height: 270px; font-size: 140px; }
  body.keys #chips { top: 780px; }
  body.keys #kbCard { top: 1060px; }
  body.keys #kb { height: 400px; }
  body.keys .wk { height: 400px; }
  body.keys .bk { height: 250px; }

  /* SERIES: same keyboard layout; a taller headline zone whose lines are each fitted to the column (fitLines). */
  .ln { display: block; white-space: nowrap; line-height: 1.04; letter-spacing: -0.035em; } /* em on the line itself, so it scales with fitLines */
  body.ser .head { top: 330px; }
  body.ser .head h1 { line-height: 1.04; white-space: normal; }
  body.ser .head .sub { font-size: 48px; margin-top: 26px; }
  body.ser #dots { top: 940px; }
  body.ser #outro h1 { font-size: 128px; }
  body.ser .pill { font-size: 54px; padding: 34px 70px; margin-top: 56px; }

  /* OUTRO */
  #outro { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 230px 96px 340px; }
  #outro h1 { font-size: 112px; }
  #outro .sub { margin-top: 36px; }
  .pill {
    margin-top: 64px; display: inline-block; padding: 28px 54px; border-radius: 999px;
    border: 2px solid var(--accent); background: rgba(145, 132, 217, 0.14);
    font-size: 40px; font-weight: 600; color: var(--bright);
  }
  .soon { margin-top: 56px; display: flex; align-items: center; gap: 18px; font-size: 32px; color: var(--muted); }
  .soon img { width: 56px; height: 56px; border-radius: 14px; }
</style>
</head>
<body>
<div id="glow"></div>

<header id="top" class="grp">
  <div class="brand"><img src="../../brand/logo.png" alt="">Ear Warrior</div>
  <div class="tag" id="tag"></div>
</header>

<section class="grp head" id="hHook"><h1 id="hookTitle"></h1><div class="sub" id="hookSub"></div></section>
<section class="grp head" id="hTurn"><h1 id="turnTitle">Your <em>turn.</em></h1><div class="sub" id="turnSub">0 listens left.<br>Play it on any instrument, or hum it.</div></section>
<section class="grp head" id="hReveal"><h1>The <em>answer.</em></h1><div class="sub" id="revealSub"></div></section>

<section class="grp full" id="sListen">
  <div id="rings"></div>
  <img id="logo" src="../../brand/logo.png" alt="">
  <div id="dots"></div>
</section>

<section class="grp full" id="sTurn">
  <svg id="count" viewBox="0 0 460 460">
    <circle cx="230" cy="230" r="206" fill="none" stroke="rgba(233,233,237,0.12)" stroke-width="14"/>
    <circle id="arc" cx="230" cy="230" r="206" fill="none" stroke="#9184d9" stroke-width="14" stroke-linecap="round"
            transform="rotate(-90 230 230)"/>
  </svg>
  <div id="num"></div>
</section>

<section class="grp full" id="sReveal"><div id="chips"></div></section>
<section class="grp full" id="kbCard"><div id="kb"></div></section>

<section class="grp full" id="outro">
  <h1 data-in="0" id="outroTitle">How many notes<br><em>did you get?</em></h1>
  <div class="sub" data-in="0" id="outroSub">Drop your score in the comments.</div>
  <div class="pill" data-in="0" id="follow"></div>
  <div class="soon" data-in="0"><img src="../../brand/logo.png" alt=""><span id="soonTxt">Coming soon · iOS &amp; Android</span></div>
</section>

<script>
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const ease = x => 1 - Math.pow(1 - x, 3);
  const $ = id => document.getElementById(id);
  const div = (cls, parent) => { const e = document.createElement('div'); e.className = cls; parent.append(e); return e; };
  /** Visible from a to b with `f` seconds of fade at each end. */
  const vis = (t, a, b, f = 0.35) => ease(seg(t, a, a + f)) * (1 - ease(seg(t, b - f, b)));

  const C = window.CHALLENGE, TL = C.timeline, N = C.notes.length;
  const INSTRUMENT = { pluck: 'Guitar', keys: 'Piano', voice: 'Voice' }[C.timbre];
  const ACCENT = '#9184d9', BRIGHT = '#b5abfc';
  const TRAIL = 'rgba(145,132,217,0.42)';
  const IDLE_CHIP = 'rgba(233,233,237,0.6)';
  const SER = C.kind === 'quiz';
  const END = SER ? TL.outroAt : TL.outroAt + 0.4; // everything but the end card is gone by here
  const KEYS = C.layout === 'keyboard';
  document.body.classList.toggle('keys', KEYS);
  document.body.classList.toggle('ser', SER);


  /** "No tabs.\nJust your *ear.*" → lines separated by <br>, *accented* words in <em>. */
  function rich(el, text) {
    text.split('\n').forEach((line, i) => {
      if (i) el.append(document.createElement('br'));
      line.split('*').forEach((part, j) => {
        if (!part) return;
        if (j % 2) { const em = document.createElement('em'); em.textContent = part; el.append(em); }
        else el.append(part);
      });
    });
  }

  /** Like rich(), but every line is its own block so fitLines can size it on its own. */
  function richLines(el, text) {
    el.textContent = '';
    text.split('\n').forEach(line => { const d = document.createElement('span'); d.className = 'ln'; rich(d, line); el.append(d); });
  }
  /** Poster-style headline: each line gets the largest size that fits the 888 px column (capped at maxPx), then the
   *  whole block shrinks to fit maxH. Lines are explicit, so measure — don't wrap. */
  function fitLines(el, maxH, maxPx = 168) {
    const lines = [...el.children];
    const sizes = lines.map(l => {
      l.style.fontSize = '100px';
      const r = document.createRange(); r.selectNodeContents(l);
      return Math.min(maxPx, 100 * 888 / r.getBoundingClientRect().width);
    });
    const k = Math.min(1, maxH / sizes.reduce((sum, f) => sum + f * 1.04, 0));
    lines.forEach((l, i) => { l.style.fontSize = Math.floor(sizes[i] * k) + 'px'; });
  }

  // --- static copy ------------------------------------------------------------------------------
  if (!SER) {
    rich($('hookTitle'), C.hook);
    if (C.hook.split('\n').length > 2) $('hookTitle').className = 'tight';
    $('hookSub').textContent = N + ' notes · ' + INSTRUMENT + ' · one listen';
  }
  if (KEYS && !SER) {
    $('turnSub').textContent = '0 listens left. Play it back.';
    // Fit the hook: no taller than the room above the dots, no wider than the column (lines are explicit, so measure, don't wrap).
    const h = $('hookTitle');
    let fs = Math.min(168, Math.floor(340 / C.hook.split('\n').length));
    const width = () => { const r = document.createRange(); r.selectNodeContents(h); return r.getBoundingClientRect().width; };
    h.style.fontSize = fs + 'px';
    while (width() > 888 && fs > 96) h.style.fontSize = (fs -= 4) + 'px';
  }
  $('revealSub').textContent = 'In ' + C.key + ' · Level ' + C.level + ' of 9';
  $('tag').textContent = 'Ear challenge #' + C.id;
  $('follow').textContent = 'Follow for challenge #' + (C.id + 1);

  if (SER) {
    richLines($('hookTitle'), C.hook); fitLines($('hookTitle'), 440);
    $('hookSub').textContent = N + ' notes · listen closely';
    richLines($('turnTitle'), 'Write the notes\n*in the comments*'); fitLines($('turnTitle'), 380);
    $('turnSub').textContent = 'One more time, slower. Name each note.';
    richLines($('outroTitle'), 'New melody\nin the next\n*Short*');
    $('outroSub').textContent = 'Write your notes in the comments.';
    $('follow').textContent = 'Subscribe →';
  }

  // --- LISTEN: pulse rings + one dot per note (count only — no pitch, no rhythm) ----------------
  const rings = C.notes.map(() => div('ring', $('rings')));
  const dots = C.notes.map(() => div('dot', $('dots')));

  // --- REVEAL: note chips + a two-octave keyboard -----------------------------------------------
  const chips = C.notes.map(n => { const e = div('nchip', $('chips')); e.textContent = n.name; return e; });

  const WHITE_PCS = [0, 2, 4, 5, 7, 9, 11];
  const isBlack = m => !WHITE_PCS.includes(m % 12);
  const midis = C.notes.map(n => n.midi);
  const whiteIdx = m => Math.floor(m / 12) * 7 + WHITE_PCS.filter(p => p <= m % 12).length - 1; // white key at or below m
  const whiteMidi = i => Math.floor(i / 7) * 12 + WHITE_PCS[i % 7];

  // The keyboard is `n` white keys starting at midi `start`. Default: two octaves from the C below the
  // melody. Keyboard layout: fewer, bigger keys (≥ 10) with the melody centred.
  function keyWindow() {
    if (!KEYS) {
      const start = Math.floor(Math.min(...midis) / 12) * 12;
      if (Math.max(...midis) >= start + 24) throw new Error('melody does not fit the two-octave keyboard');
      return { start, n: 14 };
    }
    const low = whiteIdx(Math.min(...midis)), span = whiteIdx(Math.max(...midis)) - low + 1;
    const n = Math.min(14, Math.max(10, span + 4));
    return { start: whiteMidi(low - Math.floor((n - span) / 2)), n };
  }
  const KB = keyWindow();
  const WW = 832 / KB.n, BW = WW * 0.62;
  const keyEl = {};
  let wi = 0;
  for (let m = KB.start; wi < KB.n; m++) {
    const pc = m % 12;
    if (!isBlack(m)) {
      const k = div('wk', $('kb'));
      k.style.left = wi * WW + 1.5 + 'px'; k.style.width = WW - 3 + 'px';
      if (pc === 0) { const c = div('c', k); c.textContent = 'C' + (Math.floor(m / 12) - 1); }
      keyEl[m] = k; wi++;
    } else {
      const k = div('bk', $('kb'));
      k.style.left = wi * WW - BW / 2 + 'px'; k.style.width = BW + 'px';
      keyEl[m] = k;
    }
  }
  function paintKey(m, state, glow) {
    const k = keyEl[m];
    const idle = isBlack(m) ? '#0f101b' : 'rgba(233,233,237,0.16)';
    k.style.background = state === 'cur' ? (isBlack(m) ? BRIGHT : ACCENT) : state === 'trail' ? TRAIL : idle;
    k.style.boxShadow = state === 'cur' ? '0 0 ' + Math.round(54 * glow + 10) + 'px rgba(145,132,217,0.8)' : 'none';
  }

  // Series: the hook stays through the first playing, the "write the notes" headline takes over for the second.
  const phases = (SER ? [
    ['top', 0, END], ['hHook', 0, TL.againAt - 0.4], ['hTurn', TL.againAt - 0.4, END],
    ['sListen', 0, END], ['kbCard', 0, END],
  ] : [
    ['top', 0, END], ['hHook', 0, TL.turnAt], ['sListen', 0, TL.turnAt],
    ['hTurn', TL.turnAt, TL.turnEnd], ['sTurn', TL.turnAt, TL.turnEnd],
    ['hReveal', TL.turnEnd, END], ['sReveal', TL.turnEnd, END],
    ['kbCard', KEYS ? 0 : TL.turnEnd, END],
  ]).map(([id, a, b]) => [$(id), a, b]);
  const reveals = [...document.querySelectorAll('[data-in]')];
  (SER ? [0.15, 0.4, 0.65, 0.9].map(d => END + d) : [TL.outroAt + 0.45, TL.outroAt + 0.65, TL.outroAt + 0.85, TL.outroAt + 1.0])
    .forEach((at, i) => { reveals[i].dataset.in = at; });

  window.renderAt = function (t) {
    // phase groups: the hook is already on screen at t=0 (it doubles as the thumbnail), the end card fades in last
    for (const [el, a, b] of phases) el.style.opacity = a === 0 ? 1 - ease(seg(t, b - 0.35, b)) : vis(t, a, b);
    $('outro').style.opacity = ease(seg(t, END, END + 0.5));
    for (const el of reveals) {
      const p = ease(seg(t, +el.dataset.in, +el.dataset.in + 0.55));
      el.style.opacity = p;
      el.style.transform = p < 1 ? 'translateY(' + (1 - p) * 30 + 'px)' : 'none';
      el.style.filter = p < 1 ? 'blur(' + (1 - p) * 10 + 'px)' : 'none';
    }
    $('glow').style.opacity = 0.75 + 0.25 * Math.sin(t * 1.6);
    if (SER) return renderSeries(t);

    // LISTEN
    const on = i => TL.listenAt + TL.notes[i].onset;
    let last = -1;
    C.notes.forEach((_, i) => { if (t >= on(i)) last = i; });
    rings.forEach((r, i) => {
      const p = seg(t, on(i), on(i) + 1.0);
      r.style.opacity = t >= on(i) ? 0.55 * (1 - ease(p)) : 0;
      r.style.transform = 'scale(' + (1 + 1.1 * ease(p)) + ')';
    });
    dots.forEach((d, i) => {
      const lit = t >= on(i);
      const pop = 1 - ease(seg(t, on(i), on(i) + 0.4));
      d.style.background = lit ? ACCENT : 'rgba(233,233,237,0.14)';
      d.style.transform = 'scale(' + (1 + 0.5 * pop) + ')';
      d.style.boxShadow = lit ? '0 0 ' + Math.round(26 * pop) + 'px rgba(145,132,217,0.9)' : 'none';
    });
    const pulse = last >= 0 ? Math.exp(-(t - on(last)) * 6) : 0;
    $('logo').style.transform = 'scale(' + (1 + 0.07 * pulse + 0.015 * Math.sin(t * 2.2)) + ')';
    if (KEYS) { // each note knocks on the keyboard's frame while listening
      const p = t < TL.turnAt ? pulse : 0;
      $('kbCard').style.boxShadow = p > 0.01 ? '0 0 ' + Math.round(70 * p) + 'px rgba(145,132,217,' + 0.55 * p + ')' : 'none';
      $('kbCard').style.borderColor = p > 0.01 ? 'rgba(145,132,217,' + (0.2 + 0.7 * p) + ')' : '';
    }

    // TURN
    const left = TL.turnEnd - t;
    const shown = clamp(Math.ceil(left), 1, Math.ceil(TL.turn));
    const lastTick = Math.max(...TL.ticks.filter(x => x <= t), TL.turnAt);
    $('num').textContent = shown;
    $('num').style.transform = 'scale(' + (1 + 0.14 * (1 - ease(seg(t, lastTick, lastTick + 0.3)))) + ')';
    $('num').style.color = shown === 1 ? '#c2a190' : BRIGHT;
    const C2 = 2 * Math.PI * 206;
    $('arc').style.strokeDasharray = C2;
    $('arc').style.strokeDashoffset = C2 * (1 - clamp(left / TL.turn));

    // REVEAL
    let cur = -1;
    C.notes.forEach((_, i) => { if (t >= TL.revealAt + TL.notes[i].onset) cur = i; });
    const glow = cur >= 0 ? 1 - seg(t, TL.revealAt + TL.notes[cur].onset, TL.revealAt + TL.notes[cur].onset + 0.6) : 0;
    chips.forEach((c, i) => {
      const state = i === cur ? 'cur' : i < cur ? 'trail' : 'idle';
      c.style.background = state === 'cur' ? ACCENT : state === 'trail' ? 'rgba(145,132,217,0.2)' : 'transparent';
      c.style.borderColor = state === 'idle' ? 'rgba(233,233,237,0.12)' : ACCENT;
      c.style.color = state === 'cur' ? '#fff' : state === 'trail' ? BRIGHT : IDLE_CHIP;
      c.style.transform = state === 'cur' ? 'scale(' + (1 + 0.08 * glow) + ')' : 'none';
      c.style.boxShadow = state === 'cur' ? '0 0 ' + Math.round(44 * glow) + 'px rgba(145,132,217,0.7)' : 'none';
    });
    for (const m in keyEl) {
      const played = C.notes.some((n, i) => n.midi === +m && i <= cur);
      const isCur = cur >= 0 && C.notes[cur].midi === +m;
      paintKey(+m, isCur ? 'cur' : played ? 'trail' : 'idle', glow);
    }
  };

  /** Series: the melody plays twice (listenAt, againAt); everything below is relative to the playing in progress. */
  function renderSeries(t) {
    const second = t >= TL.againAt - 0.15;
    const start = second ? TL.againAt : TL.listenAt;
    const notes = second ? TL.againNotes : TL.notes; // the second playing is slower
    let cur = -1;
    C.notes.forEach((_, i) => { if (t >= start + notes[i].onset) cur = i; });
    const pulse = cur >= 0 ? Math.exp(-(t - (start + notes[cur].onset)) * 6) : 0;

    // each note knocks on the keyboard's frame (no hint about which key)
    $('kbCard').style.boxShadow = pulse > 0.01 ? '0 0 ' + Math.round(70 * pulse) + 'px rgba(145,132,217,' + 0.55 * pulse + ')' : 'none';
    $('kbCard').style.borderColor = pulse > 0.01 ? 'rgba(145,132,217,' + (0.2 + 0.7 * pulse) + ')' : '';

    // one dot per note — the count, nothing else
    dots.forEach((d, i) => {
      const lit = cur >= i;
      const pop = lit && i === cur ? 1 - ease(seg(t, start + notes[i].onset, start + notes[i].onset + 0.4)) : 0;
      d.style.background = lit ? ACCENT : 'rgba(233,233,237,0.14)';
      d.style.transform = 'scale(' + (1 + 0.5 * pop) + ')';
      d.style.boxShadow = lit ? '0 0 ' + Math.round(26 * pop) + 'px rgba(145,132,217,0.9)' : 'none';
    });
  }

  window.renderAt(0);
</script>
</body>
</html>
