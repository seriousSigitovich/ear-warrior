<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ear Warrior lesson — Silent Night by ear</title>
<!--
  1920×1080 lesson. Same contract as ../challenge/slides.html: lesson.mjs injects window.LESSON ({ scenes, dur }) and every pixel is a pure
  function of time via window.renderAt(t). All timings come from script.mjs (the same file lesson-score.mjs lays the audio on); the numbers in
  this file are only for how things fade in. Palette mirrors src/theme/nocturne.ts.
  The high E string runs left → right (nut at X0, 12th fret at X1) with real fret spacing; a note sits between two frets, like a finger.

  Motion, all deterministic (no state between frames):
    · a CAMERA over the neck: it pushes in and follows the sounding note (followNotes), zooms out for the wide moments (the leap, the key)
    · a WIPE with a glowing edge between scenes, a STEPPER (1–4) in the corner that advances with each step
    · every note: the string vibrates, a ring and a few sparks leave the fret, the background glow breathes
    · things slide / pop in instead of just fading, and a living particle field sits behind everything
-->
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #161826; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<img id="logo" src="../../brand/logo.png" alt="" style="display:none">
<script>
  const L = window.LESSON, cv = document.getElementById('cv'), g = cv.getContext('2d');
  const C = { bg: '#161826', surface: '#232532', text: '#e9e9ed', muted: 'rgba(233,233,237,0.6)', line: 'rgba(233,233,237,0.14)', accent: '#9184d9', bright: '#b5abfc', rose: '#e58a98' };
  const FONT = '-apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif';
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const ease = x => 1 - Math.pow(1 - x, 3);
  const fade = (t, a, b) => ease(seg(t, a, b));                 // 0 → 1 between a and b
  const out = (t, a, b) => 1 - fade(t, a, b);                    // 1 → 0 between a and b
  const lerp = (a, b, k) => a + (b - a) * k;
  const pop = (t, a) => { const k = seg(t, a, a + 0.25); return k <= 0 ? 0 : 1 + 0.25 * Math.exp(-(t - a) * 9) * Math.sin(k * 3.14159); };

  // ---- per-frame state, filled by renderAt ----------------------------------------------------------------------------
  let TT = 0, PULSE = 0, VIB = { amp: 0, ph: 0 }, CAM = { Z: 1, CX: 960 };

  // ---- the neck ---------------------------------------------------------------------------------------------------
  const X0 = 170, X1 = 1750, YS = [330, 386, 442, 498, 554, 610];
  const fx = n => X0 + (X1 - X0) * (1 - Math.pow(2, -n / 12)) / 0.5;      // x of fret n (12th fret = X1)
  const mx = n => (n === 0 ? X0 - 46 : (fx(n - 1) + fx(n)) / 2);           // where a finger sits for fret n
  const camX = x => (x - CAM.CX) * CAM.Z + 960;                            // neck x → screen x through the camera
  const cx = n => camX(mx(n));
  /** Draw `fn` in neck space through the camera (zoom about the neck's middle, clipped to the neck band). */
  function cam(fn) {
    g.save(); g.beginPath(); g.rect(0, 216, 1920, 490); g.clip();
    g.translate(960, 470); g.scale(CAM.Z, CAM.Z); g.translate(-CAM.CX, -470); fn(); g.restore();
  }

  function txt(s, x, y, { size = 32, weight = 600, color = C.text, align = 'left', alpha = 1, rise } = {}) {
    if (alpha <= 0.003) return;
    const lift = (rise ?? (align === 'center' && size >= 36)) ? (1 - alpha) * 16 : 0;   // captions float up as they appear
    g.save(); g.globalAlpha = alpha; g.fillStyle = color; g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'alphabetic';
    g.fillText(s, x, y + lift); g.restore();
  }
  function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  // a living background: drifting glow, particle field, breathing with every note
  const seeded = seed => () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const rnd = seeded(7);
  const PARTS = Array.from({ length: 80 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, vx: -6 + rnd() * 12, vy: -10 - rnd() * 22, r: 1.2 + rnd() * 2.8, ph: rnd() * 6.28 }));
  function background() {
    const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, '#0d0e18'); gr.addColorStop(0.5, '#161826'); gr.addColorStop(1, '#121320');
    g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
    const gx = 960 + 380 * Math.sin(TT * 0.22), gy = 360 + 80 * Math.cos(TT * 0.17);
    const rg = g.createRadialGradient(gx, gy, 0, gx, gy, 900 + 90 * PULSE);
    rg.addColorStop(0, `rgba(145,132,217,${0.16 + 0.14 * PULSE})`); rg.addColorStop(1, 'rgba(145,132,217,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 1920, 1080);
    for (const p of PARTS) {
      const x = ((p.x + p.vx * TT) % 1920 + 1920) % 1920, y = ((p.y + p.vy * TT) % 1080 + 1080) % 1080;
      g.globalAlpha = 0.07 + 0.1 * (0.5 + 0.5 * Math.sin(TT * 0.9 + p.ph)) + 0.12 * PULSE;
      g.fillStyle = C.bright; g.beginPath(); g.arc(x, y, p.r, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;
  }

  const STEP = { home: 1, chords: 2, ladder: 3, pick: 4 };
  function stepper(s, lt) {
    const cur = STEP[s.id] ?? (s.id === 'outro' ? 5 : 0);
    if (!cur) return;
    const xs = [1560, 1640, 1720, 1800], y = 66, from = (cur - 2) / 3, to = Math.min(cur - 1, 3) / 3;
    const prog = lerp(Math.max(0, from), to, ease(seg(lt, 0.1, 0.8)));
    g.save(); g.lineCap = 'round'; g.lineWidth = 4;
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(xs[0], y); g.lineTo(xs[3], y); g.stroke();
    g.strokeStyle = C.accent; g.beginPath(); g.moveTo(xs[0], y); g.lineTo(xs[0] + (xs[3] - xs[0]) * prog, y); g.stroke();
    xs.forEach((x, i) => {
      const done = i < cur - 1, now = i === cur - 1, k = now ? 1 + 0.18 * Math.sin(seg(lt, 0.1, 0.5) * 3.14159) : 1;
      g.save(); g.translate(x, y); g.scale(k, k);
      g.beginPath(); g.arc(0, 0, 19, 0, 6.283);
      if (done || now) { g.fillStyle = now ? C.bright : C.accent; g.shadowColor = now ? C.bright : 'transparent'; g.shadowBlur = now ? 16 : 0; g.fill(); } else { g.lineWidth = 3; g.strokeStyle = C.line; g.stroke(); }
      g.shadowBlur = 0; g.fillStyle = done || now ? '#fff' : C.muted; g.font = `700 22px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(i + 1), 0, 2);
      g.restore();
    });
    g.restore();
  }

  function header(s, lt) {
    const logo = document.getElementById('logo');
    if (logo.complete && logo.naturalWidth) { g.save(); rr(80, 40, 52, 52, 13); g.clip(); g.drawImage(logo, 80, 40, 52, 52); g.restore(); }
    txt('Ear Warrior', 148, 78, { size: 30, weight: 650, alpha: 0.9 });
    if (s.title) {
      const a = fade(lt, 0.15, 0.7);
      txt(s.title, 80 - (1 - a) * 60, 190, { size: 62, weight: 700, alpha: a });
      g.save(); g.globalAlpha = a; g.fillStyle = C.accent; rr(80, 206, 90 * ease(seg(lt, 0.3, 0.9)), 5, 2.5); g.fill(); g.restore();
    }
    stepper(s, lt);
  }

  /** The board and strings (neck space). The high E string vibrates after every note. */
  function neck({ alpha = 1, focus = 1 } = {}) {
    if (alpha <= 0.003) return;
    g.save(); g.globalAlpha = alpha;
    rr(X0 - 8, 296, X1 - X0 + 70, 348, 18); g.fillStyle = '#1c1e30'; g.fill(); g.lineWidth = 2; g.strokeStyle = C.line; g.stroke();
    g.fillStyle = 'rgba(233,233,237,0.07)';
    for (const n of [3, 5, 7, 9]) { g.beginPath(); g.arc(mx(n), 470, 13, 0, 6.283); g.fill(); }
    for (const y of [414, 526]) { g.beginPath(); g.arc(mx(12), y, 13, 0, 6.283); g.fill(); }
    g.strokeStyle = 'rgba(233,233,237,0.26)'; g.lineWidth = 2;
    for (let n = 1; n <= 12; n++) { g.beginPath(); g.moveTo(fx(n), 304); g.lineTo(fx(n), 636); g.stroke(); }
    g.strokeStyle = 'rgba(233,233,237,0.8)'; g.lineWidth = 8; g.beginPath(); g.moveTo(X0, 300); g.lineTo(X0, 640); g.stroke();
    const W = [2.4, 3, 3.6, 4.4, 5.2, 6.2];
    YS.forEach((y, i) => {
      g.strokeStyle = i === 0 ? 'rgba(233,233,237,0.95)' : `rgba(233,233,237,${0.5 - 0.38 * focus})`;
      g.lineWidth = W[i]; g.beginPath();
      if (i === 0 && VIB.amp > 0.25) {
        const xa = X0 - 60, xb = X1 + 54, N = 72;
        for (let k = 0; k <= N; k++) { const u = k / N, yy = y + VIB.amp * Math.sin(Math.PI * u) * Math.sin(VIB.ph + u * 5); k ? g.lineTo(xa + (xb - xa) * u, yy) : g.moveTo(xa, yy); }
      } else { g.moveTo(X0 - 60, y); g.lineTo(X1 + 54, y); }
      g.stroke();
    });
    g.restore();
  }
  /** The fret numbers under the neck: screen space, following the camera in x only. */
  function fretNums(alphaOf = () => 1) {
    for (let n = 0; n <= 12; n++) txt(String(n), cx(n), 686, { size: 26, weight: 600, align: 'center', color: C.muted, alpha: alphaOf(n) });
  }

  function dot(n, label, { a = 1, s = 1, fill = C.accent, hollow = false, r = 28, y = YS[0], size = 28 } = {}) {
    if (a <= 0.003 || s <= 0) return;
    g.save(); g.globalAlpha = a; g.translate(mx(n), y); g.scale(s, s); g.beginPath(); g.arc(0, 0, r, 0, 6.283);
    if (hollow) { g.lineWidth = 4; g.strokeStyle = fill; g.stroke(); }
    else { g.fillStyle = fill; g.shadowColor = fill; g.shadowBlur = 20; g.fill(); g.shadowBlur = 0; }
    if (label != null) { g.fillStyle = hollow ? fill : '#fff'; g.font = `700 ${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, 0, 2); }
    g.restore();
  }
  function ring(n, since, { color = C.bright, max = 70 } = {}) {
    if (since < 0 || since > 1.2) return;
    const k = since / 1.2; g.save(); g.globalAlpha = 1 - k; g.strokeStyle = color; g.lineWidth = 4; g.beginPath(); g.arc(mx(n), YS[0], 30 + max * k, 0, 6.283); g.stroke(); g.restore();
  }
  /** Sparks flying off a fret right after a note lands. */
  function sparks(n, age) {
    if (age < 0 || age > 0.65) return;
    const k = ease(age / 0.65);
    g.save(); g.fillStyle = C.bright;
    for (let i = 0; i < 8; i++) {
      const a = i * 0.785 + n * 0.7, d = 38 + 70 * k;
      g.globalAlpha = (1 - age / 0.65) * 0.9; g.beginPath(); g.arc(mx(n) + Math.cos(a) * d, YS[0] + Math.sin(a) * d * 0.8, 4 * (1 - 0.6 * k), 0, 6.283); g.fill();
    }
    g.restore();
  }
  /** Light the frets of the scene's guitar notes while they sound (label = the fret number when `labels`). */
  function lit(s, lt, labels) {
    for (const e of s.audio) {
      if (e.kind !== 'note' || e.vis === false) continue;
      const age = lt - e.at;
      if (age < -0.02 || age > e.dur + 0.65) continue;
      const a = age < e.dur ? 1 : clamp(1 - (age - e.dur) / 0.45);
      dot(e.fret, labels ? e.label : null, { a, s: 1 + 0.22 * Math.exp(-Math.max(age, 0) * 8) });
      ring(e.fret, age); sparks(e.fret, age);
    }
  }
  function hummed(s, lt) { // the hummed tune lights the neck softly (hollow ring)
    for (const e of s.audio) {
      if (e.kind !== 'hum' || e.vis === false) continue;
      const age = lt - e.at; if (age < 0 || age > e.dur) continue;
      dot(e.fret, null, { a: 0.9, hollow: true, fill: C.bright, s: 1 + 0.15 * Math.exp(-age * 8) });
    }
  }

  // ---- the camera ---------------------------------------------------------------------------------------------------
  /** Push in and follow the sounding note: centre on each note in turn (smoothly), zoom with a tiny kick on every onset. */
  function followNotes(s, lt, Z, lag = 0.45) {
    const ev = s.audio.filter(e => e.kind === 'note');
    let i = -1;
    for (let k = 0; k < ev.length; k++) if (ev[k].at <= lt) i = k;
    const mid = (X0 + X1) / 2;
    if (i < 0) return { Z: 1, CX: mid };
    const x1 = mx(ev[i].fret), x0 = i > 0 ? mx(ev[i - 1].fret) : mid, k = ease(seg(lt, ev[i].at, ev[i].at + lag));
    const zin = ease(seg(lt, ev[0].at - 0.3, ev[0].at + 0.7)), age = lt - ev[i].at;
    return { Z: (1 + (Z - 1) * zin) * (1 + 0.025 * Math.exp(-age * 8)), CX: clamp(lerp(x0, x1, k), 360, 1560) };
  }
  const wide = { Z: 1, CX: 960 };
  const blend = (a, b, k) => ({ Z: lerp(a.Z, b.Z, k), CX: lerp(a.CX, b.CX, k) });

  // ---- the tab under the neck: six lines (top = high e), frets written on the line, four bars ---------------------------------------
  const TABX0 = 250, BW = 380, TABY = [782, 820, 858, 896, 934, 972];
  const barX = i => TABX0 + i * BW;
  /** A guitar tab staff that slides up; `items` are the frets written so far, `tint[i]` (0..1) lights bar i, `playhead` is an x. */
  function tab(lt, items, { tint = [], playhead } = {}) {
    const k = fade(lt, 0.15, 0.85);
    g.save(); g.translate(0, (1 - k) * 70); g.globalAlpha = k;
    tint.forEach((v, i) => { if (v > 0) { g.save(); g.globalAlpha = k * v * 0.22; g.fillStyle = C.accent; rr(barX(i) + 5, TABY[0] - 30, BW - 10, TABY[5] - TABY[0] + 60, 14); g.fill(); g.restore(); } });
    g.strokeStyle = 'rgba(233,233,237,0.42)'; g.lineWidth = 2;
    for (const y of TABY) { g.beginPath(); g.moveTo(TABX0, y); g.lineTo(TABX0 + 4 * BW, y); g.stroke(); }
    for (let i = 0; i <= 4; i++) { g.lineWidth = i === 0 || i === 4 ? 4 : 2; g.beginPath(); g.moveTo(barX(i), TABY[0]); g.lineTo(barX(i), TABY[5]); g.stroke(); }
    ['T', 'A', 'B'].forEach((ch, i) => txt(ch, TABX0 - 76, TABY[1] + 6 + i * 40, { size: 36, weight: 800, align: 'center', alpha: k, rise: false }));
    ['e', 'B', 'G', 'D', 'A', 'E'].forEach((nm, i) => txt(nm, TABX0 - 20, TABY[i] + 7, { size: 22, weight: 600, align: 'right', color: C.muted, alpha: k, rise: false }));
    for (let i = 0; i < 4; i++) txt(String(i + 1), barX(i) + 12, TABY[0] - 40, { size: 24, weight: 600, color: C.muted, alpha: k, rise: false });
    g.restore();
    for (const it of items) { // { bar, fret, at, j, count } — a fret number written on the top line, popping in
      const x = barX(it.bar) + (it.j + 0.5) * (BW / it.count), kk = pop(lt, it.at);
      if (kk <= 0) continue;
      const a = fade(lt, it.at, it.at + 0.2), w = String(it.fret).length > 1 ? 66 : 46;
      g.save(); g.globalAlpha = a * 0.96; g.fillStyle = '#171929'; rr(x - w / 2, TABY[0] - 22, w, 44, 10); g.fill(); g.restore();   // the number cuts the line, as in real tab
      txt(String(it.fret), x, TABY[0] + 15, { size: 44 * kk, weight: 700, align: 'center', color: C.bright, alpha: a, rise: false });
    }
    if (playhead != null) { g.save(); g.shadowColor = C.bright; g.shadowBlur = 18; g.strokeStyle = C.bright; g.lineWidth = 4; g.beginPath(); g.moveTo(playhead, TABY[0] - 34); g.lineTo(playhead, TABY[5] + 34); g.stroke(); g.restore(); }
  }
  const placed = (bar, frets, ats) => frets.map((f, j) => ({ bar, fret: f, at: ats[j], j, count: frets.length }));

  // ---- scenes -------------------------------------------------------------------------------------------------------------
  const DRAW = {
    hook(s, lt) {
      const c = s.cue;
      CAM = { Z: 1 + 0.08 * seg(lt, 0, 12), CX: 960 };
      cam(() => { neck({ alpha: 0.25 + 0.75 * fade(lt, c.focus - 0.4, c.focus + 1), focus: fade(lt, c.focus, c.focus + 1.5) }); lit(s, lt, false); });
      fretNums(n => fade(lt, c.nums + 0.12 * n, c.nums + 0.4 + 0.12 * n));
      const ta = fade(lt, c.titleIn, c.titleIn + 0.9) * out(lt, c.titleOut, c.titleOut + 1), sc = 0.92 + 0.08 * ease(seg(lt, c.titleIn, c.titleIn + 1.2));
      g.save(); g.translate(960, 540); g.scale(sc, sc); g.translate(-960, -540);
      txt('Silent Night', 960, 540, { size: 168, weight: 700, align: 'center', alpha: ta, rise: false });
      g.restore();
      txt('by ear · no tabs', 960, 625, { size: 52, weight: 500, align: 'center', color: C.bright, alpha: fade(lt, c.subIn, c.subIn + 0.8) * out(lt, c.titleOut, c.titleOut + 1) });
      txt('high E string · frets 0–12', 960, 262, { size: 38, weight: 600, align: 'center', color: C.bright, alpha: fade(lt, c.label, c.label + 0.8) });
      txt('one octave, one string', 960, 800, { size: 52, weight: 650, align: 'center', alpha: fade(lt, c.tagline, c.tagline + 0.8) });
    },
    listen(s, lt) {
      const c = s.cue;
      CAM = blend(followNotes(s, lt, 1.16), wide, fade(lt, 8.2, 9));
      cam(() => { neck({ focus: 1 }); lit(s, lt, false); });
      fretNums(() => 0.5);
      const tint = [0, 1, 2, 3].map(i => (lt >= 0.2 + i * 2 && lt < 0.2 + (i + 1) * 2 ? 1 : (lt > c.same && i < 2 ? 0.5 : 0)));
      tab(lt, [], { tint, playhead: lt >= 0.2 && lt <= 8.3 ? lerp(barX(0), barX(4), (lt - 0.2) / 8) : undefined });
      const same = fade(lt, c.same, c.same + 0.6);
      if (same > 0) { g.save(); g.globalAlpha = same; g.strokeStyle = C.bright; g.lineWidth = 4; g.beginPath(); g.moveTo(barX(0) + 190, TABY[5] + 38); g.lineTo(barX(0) + 190, TABY[5] + 50); g.lineTo(barX(1) + 190, TABY[5] + 50); g.lineTo(barX(1) + 190, TABY[5] + 38); g.stroke(); g.restore();
        txt('same', barX(1), TABY[5] + 86, { size: 36, weight: 700, color: C.bright, align: 'center', alpha: same, rise: true }); }
      txt('3 bars to work out, not 4', 1470, TABY[5] + 86, { size: 36, weight: 650, align: 'center', alpha: fade(lt, c.three, c.three + 0.7) });
    },
    home(s, lt) {
      const c = s.cue;
      CAM = followNotes(s, lt, 1.3);
      if (lt < c.slide - 0.3) CAM = { Z: 1 + 0.05 * seg(lt, 0, c.slide), CX: 960 };
      cam(() => {
        neck({ focus: 1 });
        const steps = [5, 6, 7, 8, 9];
        if (lt >= c.slide && lt < c.home) { const i = Math.min(4, Math.floor((lt - c.slide) / c.step)); dot(steps[i], null, { hollow: true, fill: C.bright, a: 0.95 }); }
        if (lt >= c.home) { dot(10, 'D', { fill: C.bright, s: pop(lt, c.home) || 1 }); ring(10, lt - c.home); ring(10, lt - c.home - 0.25, { max: 110 }); sparks(10, lt - c.home); }
      });
      fretNums();
      // the hum: ripples spreading from the middle while the hummed note sounds
      for (const e of s.audio) if (e.kind === 'hum') {
        const age = lt - e.at;
        for (let r = 0; r < 3; r++) { const a = age - r * 0.5; if (a > 0 && age < e.dur + 0.8) { const k = (a % 1.5) / 1.5; g.save(); g.globalAlpha = (1 - k) * 0.6; g.strokeStyle = C.bright; g.lineWidth = 3; g.beginPath(); g.arc(960, 930, 18 + 90 * k, 0, 6.283); g.stroke(); g.restore(); } }
      }
      txt('Hum the last note of the song', 960, 800, { size: 54, weight: 650, align: 'center', alpha: fade(lt, c.humText, c.humText + 0.6) * out(lt, c.slideText - 0.3, c.slideText + 0.2) });
      txt('Slide up until it matches your voice', 960, 800, { size: 54, weight: 650, align: 'center', alpha: fade(lt, c.slideText, c.slideText + 0.6) * out(lt, c.label - 0.3, c.label + 0.2) });
      txt('Fret 10 = D = home', 960, 800, { size: 70, weight: 700, align: 'center', color: C.bright, alpha: fade(lt, c.label, c.label + 0.7) });
      txt('an octave higher is still the same note', 960, 870, { size: 38, weight: 500, align: 'center', color: C.muted, alpha: fade(lt, c.octave, c.octave + 0.8) });
    },
    chords(s, lt) {
      const c = s.cue;
      CAM = wide;
      cam(() => { neck({ alpha: 0.42, focus: 1 }); hummed(s, lt); });
      fretNums(() => 0.3);
      // how loudly / how recently each chord sounds → glow and string wobble
      const act = name => { let age = 99, dur = 0; for (const e of s.audio) if (e.kind === 'chord' && e.name === name && lt >= e.at && lt - e.at < age) { age = lt - e.at; dur = e.dur; } return { wob: age < 1.6 ? Math.exp(-age * 3.5) : 0, glow: age < dur ? 1 : clamp(1 - (age - dur) / 0.5) }; };
      const box = (cxx, name, sub, frets, a, hi, pulse, ac) => {
        g.save(); g.globalAlpha = a;
        if (ac.glow > 0.02) { g.save(); g.globalAlpha = a * ac.glow * 0.9; g.shadowColor = C.accent; g.shadowBlur = 30; g.strokeStyle = C.accent; g.lineWidth = 3; rr(cxx - 130, 712, 350, 340, 26); g.stroke(); g.restore(); }
        txt(name, cxx, 757, { size: 56 + 6 * ac.wob, weight: 700, align: 'center', rise: false });
        txt(sub, cxx + 110, 757, { size: 30, weight: 500, color: C.muted, rise: false });
        const x0 = cxx - 85, y0 = 800, sx = 34, sy = 46;
        g.strokeStyle = 'rgba(233,233,237,0.5)'; g.lineWidth = 2;
        for (let i = 0; i < 6; i++) { const wob = frets[i] >= 0 ? 3.2 * ac.wob * Math.sin(lt * 60 + i * 1.7) : 0; g.beginPath(); g.moveTo(x0 + i * sx + wob, y0); g.quadraticCurveTo(x0 + i * sx - wob * 1.6, y0 + 2 * sy, x0 + i * sx + wob, y0 + 4 * sy); g.stroke(); }
        for (let r = 0; r <= 4; r++) { g.lineWidth = r === 0 ? 7 : 2; g.beginPath(); g.moveTo(x0, y0 + r * sy); g.lineTo(x0 + 5 * sx, y0 + r * sy); g.stroke(); }
        frets.forEach((f, i) => {
          const x = x0 + i * sx;
          if (f < 0) txt('×', x, y0 - 12, { size: 30, align: 'center', color: C.muted, rise: false });
          else if (f === 0) { g.lineWidth = 3; g.beginPath(); g.arc(x, y0 - 22, 8, 0, 6.283); g.stroke(); }
          else { g.fillStyle = i === 5 ? C.bright : C.accent; g.beginPath(); g.arc(x, y0 + (f - 0.5) * sy, 15 * (1 + 0.25 * ac.wob), 0, 6.283); g.fill(); }
        });
        if (hi > 0) { const f = frets[5]; g.globalAlpha = a * hi; g.strokeStyle = C.bright; g.lineWidth = 4; g.beginPath(); g.arc(x0 + 5 * sx, y0 + (f - 0.5) * sy, 26 + 6 * pulse, 0, 6.283); g.stroke(); }
        g.restore();
      };
      const hi = fade(lt, c.diff, c.diff + 0.5) * out(lt, c.diffOut - 0.4, c.diffOut), pulse = 0.5 + 0.5 * Math.sin(lt * 7);
      const slideIn = (at, dx) => (1 - fade(lt, at, at + 0.7)) * dx;
      g.save(); g.translate(-slideIn(c.dIn, 160), 0); box(620, 'D', '· bright', [-1, -1, 0, 2, 3, 2], fade(lt, c.dIn, c.dIn + 0.6), hi, pulse, act('D')); g.restore();
      g.save(); g.translate(slideIn(c.dmIn, 160), 0); box(1300, 'Dm', '· dark', [-1, -1, 0, 2, 3, 1], fade(lt, c.dmIn, c.dmIn + 0.6), hi, pulse, act('Dm')); g.restore();
      txt('one finger moves', 960, 905, { size: 38, weight: 600, align: 'center', color: C.bright, alpha: hi });
      txt('✓ fits', 620, 1040, { size: 50 * (pop(lt, c.fits) || 1), weight: 700, align: 'center', color: C.bright, alpha: fade(lt, c.fits, c.fits + 0.6), rise: false });
      txt('✗ doesn’t fit', 1300, 1040, { size: 50 * (pop(lt, c.notFit) || 1), weight: 700, align: 'center', color: C.rose, alpha: fade(lt, c.notFit, c.notFit + 0.6), rise: false });
      txt('Silent Night  →  D  →  major', 960, 262, { size: 48, weight: 700, align: 'center', color: C.bright, alpha: fade(lt, c.concl, c.concl + 0.7) });
    },
    ladder(s, lt) {
      const c = s.cue, KEY = [0, 2, 3, 5, 7, 9, 10, 12], dimmed = fade(lt, c.skip, c.skip + 0.7);
      CAM = blend(followNotes(s, lt, 1.22), wide, fade(lt, c.twelve + 0.8, c.key));
      cam(() => {
        neck({ focus: 1 });
        [10, 9, 7, 5, 3, 2, 0].forEach((f, i) => {
          const at = c.start + i * c.step;
          dot(f, String(f), { a: fade(lt, at, at + 0.2), s: pop(lt, at) || 1, fill: f === 10 ? C.bright : C.accent });
          ring(f, lt - at); sparks(f, lt - at);
        });
        dot(12, '12', { a: fade(lt, c.twelve, c.twelve + 0.3), s: pop(lt, c.twelve) || 1 });
        ring(12, lt - c.twelve); sparks(12, lt - c.twelve);
      });
      fretNums(n => (KEY.includes(n) ? 1 : 1 - 0.82 * dimmed));
      txt('The frets of the key', 960, 810, { size: 66, weight: 700, align: 'center', alpha: fade(lt, c.key, c.key + 0.7) });
      txt('everything else: skip it', 960, 890, { size: 46, weight: 600, align: 'center', color: C.bright, alpha: fade(lt, c.skip, c.skip + 0.8) });
    },
    pick(s, lt) {
      const c = s.cue;
      const k1 = fade(lt, c.leap - 0.3, c.leap + 0.4) * out(lt, c.pull - 0.2, c.pull + 0.5), k2 = fade(lt, c.noTab - 0.4, c.noTab + 0.4);
      CAM = blend(blend(followNotes(s, lt, 1.3), wide, k1), wide, k2);
      cam(() => {
        neck({ focus: 1 });
        lit(s, lt, true);
        // bar 1 is found by trial: an attempt marker follows the guesses (a wrong one stays until the right one)
        const cur = c.tries.filter((t, i) => lt >= t[0] && lt < Math.min(t[0] + (t[2] === 'bad' ? 4.4 : 1.8), c.tries[i + 1]?.[0] ?? 99)).pop();
        if (cur && lt < 17) { dot(cur[1], null, { hollow: true, fill: cur[2] === 'bad' ? C.rose : C.bright, s: pop(lt, cur[0]) || 1 }); ring(cur[1], lt - cur[0], { color: cur[2] === 'bad' ? C.rose : C.bright }); }
      });
      fretNums();
      txt('Not quite · not in the key', cx(6), 262, { size: 44, weight: 700, align: 'center', color: C.rose, alpha: fade(lt, c.notQuite, c.notQuite + 0.4) * out(lt, c.notQuiteOut - 0.3, c.notQuiteOut) });
      // the big leap and the pull
      const arc = fade(lt, c.leap, c.leap + 0.5) * out(lt, c.pull - 0.4, c.pull);
      if (arc > 0) { g.save(); g.globalAlpha = arc; g.strokeStyle = C.bright; g.lineWidth = 5; g.beginPath(); g.moveTo(cx(2), 280); g.quadraticCurveTo((cx(2) + cx(12)) / 2, 190, lerp(cx(2), cx(12), seg(lt, c.leap, c.leap + 0.45)), 280); g.stroke(); g.restore();
        txt('big leap', (cx(2) + cx(12)) / 2, 196, { size: 46, weight: 700, align: 'center', color: C.bright, alpha: arc }); }
      txt('fret 12 = the open string, one octave up', 1330, 438, { size: 36, weight: 600, align: 'center', color: C.bright, alpha: fade(lt, c.octave, c.octave + 0.6) * out(lt, c.pull - 0.4, c.pull) });
      const pull = fade(lt, c.pull, c.pull + 0.4) * out(lt, c.pull + 1.9, c.pull + 2.3);
      if (pull > 0) { g.save(); g.globalAlpha = pull; g.strokeStyle = C.bright; g.lineWidth = 5; g.beginPath(); g.moveTo(cx(9) + 26, 262); g.lineTo(cx(10) - 26, 262); g.stroke(); g.restore();
        txt('9 leans up to home', (cx(9) + cx(10)) / 2, 236, { size: 40, weight: 700, align: 'center', color: C.bright, alpha: pull }); }
      const items = [
        ...placed(0, [5, 7, 5, 2], [6.5, 13.0, 14.6, 16.2]),
        ...placed(1, [5, 7, 5, 2], [17.3, 17.4, 17.5, 17.6]),
        ...placed(2, [12, 12, 9], [19.6, 20.4, 20.8]),
        ...placed(3, [10, 10, 5], [25.1, 25.9, 26.35]),
      ];
      tab(lt, items);
      txt('Your own tab.', 960, 1050, { size: 52 * (pop(lt, c.noTab) || 1), weight: 700, align: 'center', color: C.bright, alpha: fade(lt, c.noTab, c.noTab + 0.7), rise: false });
    },
    outro(s, lt) {
      const c = s.cue;
      const cards = [['1', 'Find home'], ['2', 'Bright or dark'], ['3', 'Key frets'], ['4', 'Pick by ear']];
      cards.forEach(([n, t], i) => {
        const at = c.cards + i * c.cardStep, a = fade(lt, at, at + 0.5), x = 150 + i * 430 + (1 - ease(seg(lt, at, at + 0.6))) * 220, sc = 0.9 + 0.1 * ease(seg(lt, at, at + 0.5));
        g.save(); g.translate(x + 200, 430); g.scale(sc, sc); g.translate(-(x + 200), -430); g.globalAlpha = a; rr(x, 330, 400, 200, 26); g.fillStyle = C.surface; g.fill(); g.lineWidth = 2; g.strokeStyle = C.line; g.stroke(); g.restore();
        txt(n, x + 36, 420, { size: 80, weight: 700, color: C.bright, alpha: a, rise: false });
        txt(t, x + 36, 490, { size: 38, weight: 650, alpha: a, rise: false });
      });
      txt('Which song can’t you find tabs for?', 960, 700, { size: 70, weight: 700, align: 'center', alpha: fade(lt, c.cta, c.cta + 0.8) });
      txt('Comment it.', 960, 780, { size: 52, weight: 600, align: 'center', color: C.bright, alpha: fade(lt, c.comment, c.comment + 0.7) });
      txt('earwarrior.app  ·  early access', 960, 920, { size: 40, weight: 500, align: 'center', color: C.muted, alpha: fade(lt, c.brand, c.brand + 0.8) });
    },
  };

  window.renderAt = t => {
    const s = L.scenes.find(x => t >= x.start && t < x.start + x.dur) ?? L.scenes[L.scenes.length - 1], lt = t - s.start;
    TT = t;
    // the beat: the latest guitar note or strum in this scene drives the glow and the string's vibration
    let age = 9, vage = 9;
    for (const e of s.audio) { if (e.kind === 'note' || e.kind === 'chord') { if (lt >= e.at && lt - e.at < age) age = lt - e.at; } if (e.kind === 'note' && lt >= e.at && lt - e.at < vage) vage = lt - e.at; }
    PULSE = age < 9 ? Math.exp(-age * 6) : 0;
    VIB = vage < 2 ? { amp: 9 * Math.exp(-vage * 3.2), ph: 6.283 * 8 * vage } : { amp: 0, ph: 0 };
    CAM = wide;
    g.clearRect(0, 0, 1920, 1080);
    background();
    const wl = s.start > 0 ? ease(seg(lt, 0, 0.55)) : 1;     // a wipe reveals each scene left → right
    g.save();
    if (wl < 1) { g.beginPath(); g.rect(0, 0, 1920 * wl, 1080); g.clip(); }
    header(s, lt);
    DRAW[s.id](s, lt);
    g.restore();
    if (wl < 1) {
      const x = 1920 * wl, gr = g.createLinearGradient(x - 220, 0, x, 0);
      gr.addColorStop(0, 'rgba(181,171,252,0)'); gr.addColorStop(1, 'rgba(181,171,252,0.45)');
      g.fillStyle = gr; g.fillRect(x - 220, 0, 220, 1080);
      g.save(); g.shadowColor = C.bright; g.shadowBlur = 24; g.fillStyle = C.bright; g.fillRect(x - 2, 0, 4, 1080); g.restore();
    }
    if (s.start === 0) { g.save(); g.globalAlpha = 1 - ease(seg(lt, 0, 0.35)); g.fillStyle = C.bg; g.fillRect(0, 0, 1920, 1080); g.restore(); }
  };
  window.ready = new Promise(res => { const l = document.getElementById('logo'); if (l.complete) res(); else { l.onload = res; l.onerror = res; } }).then(() => document.fonts.ready);
</script>
