# Local dev stack: Postgres + the Fastify API.
#   docker compose up          -> Postgres on :5432, API on :8080
#   docker compose up postgres -> just the database (run the API with `npm run dev`)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ear_warrior
      POSTGRES_PASSWORD: ear_warrior
      POSTGRES_DB: ear_warrior
    ports:
      - '5432:5432'
    volumes:
      - ear_warrior_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ear_warrior']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ear_warrior:ear_warrior@postgres:5432/ear_warrior
      PORT: '8080'
      CORS_ORIGIN: '*'
    ports:
      - '8080:8080'

volumes:
  ear_warrior_pgdata:
